<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>站内阅读 · Resets AI</title>
  <meta name="description" content="阅读 Resets AI 人工整理的 AI 创业与实操内容。" />
  <style>
    @font-face { font-family: GenSen; src:url("/fonts/GenSenRounded-Heavy-UI.woff2"); font-weight:800; font-display:swap; }
    :root { --ink:#192753; --muted:#536381; --paper:#eaf2ff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    .shell { width:min(100% - 32px,900px); margin:0 auto; padding:30px 0 70px; }
    .back { color:inherit; text-decoration:none; font-weight:800; }
    .paper { margin-top:24px; padding:clamp(22px,5vw,54px); background:#fafdff; border:3px solid var(--ink); border-radius:22px; box-shadow:7px 7px 0 var(--ink); }
    .eyebrow { color:#6754dc; font-weight:800; font-size:13px; }
    h1 { margin:15px 0; font:800 clamp(27px,4vw,42px)/1.3 GenSen,sans-serif; }
    .meta,.summary,.credit { color:var(--muted); line-height:1.8; }
    .meta { font-size:13px; }
    .summary { padding:17px 20px; border-radius:13px; background:#e8f1ff; }
    .cover { display:none; width:100%; max-height:460px; margin:25px 0; border-radius:14px; object-fit:cover; }
    .body { font-size:16px; line-height:1.95; overflow-wrap:anywhere; }
    .body h2,.body h3 { margin:34px 0 10px; font-family:GenSen,sans-serif; line-height:1.4; }
    .body p { white-space:pre-wrap; }
    .body figure { margin:24px 0; }
    .body img { display:block; max-width:100%; margin:auto; border-radius:10px; }
    .body figcaption { margin-top:8px; color:var(--muted); text-align:center; font-size:12px; }
    .body blockquote { margin:22px 0; padding:2px 18px; border-left:4px solid #6754dc; background:#f0edff; }
    .video { width:100%; aspect-ratio:16/9; border:0; border-radius:12px; }
    .video.x-embed { aspect-ratio:auto; height:min(620px,75vh); }
    .source { display:inline-block; margin-top:20px; color:var(--ink); font-weight:800; }
    .credit { margin-top:32px; border-top:2px solid var(--ink); padding-top:20px; font-size:13px; }
    .error { color:#a32c35; }
  </style>
</head>
<body>
  <main class="shell"><a class="back" href="/#news">← 返回 AI 赚钱情报</a>
    <article class="paper" id="article"><div class="eyebrow" id="category">正在读取</div><h1 id="title">正在加载文章…</h1><p class="meta" id="meta"></p><p class="summary" id="summary" hidden></p><img class="cover" id="cover" alt="" /><div class="body" id="body"></div><div class="credit" id="credit"></div><a class="source" id="source" target="_blank" rel="noopener noreferrer" hidden>查看原始内容 ↗</a></article>
  </main>
  <script type="module" src="/article.js"></script>
</body>
</html>
