<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>注册读者账号 · Resets AI</title><link rel="stylesheet" href="/reader-account.css"></head><body data-mode="register"><div class="shell"><header class="mast"><a class="brand" href="/">Resets AI</a><a class="back" href="/">← 返回网站</a></header><main class="stage"><div class="intro"><span class="tag">读者账号</span><h1>注册后，阅读全部档案。</h1><p>访客可以阅读最新发布的 1 篇档案。注册读者账号后，所有已发布档案都可阅读。</p></div><section class="card"><h2>创建读者账号</h2><form id="account-form"><label>用户名<input name="username" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" required></label><p class="hint">3–24 位英文、数字或下划线。</p><label>密码<input name="password" type="password" autocomplete="new-password" minlength="7" required></label><p class="hint">长度必须大于 6 位。本站不会保存明文密码。</p><button class="submit" id="submit" type="submit">注册并开始阅读 ↗</button><p class="status" id="status" role="status" aria-live="polite"></p></form><p class="switch">已有账号？<a href="/reader-login.html">登录</a></p></section></main></div><script defer src="/reader-account.js"></script></body></html>
